[project]
name = "ac-fdtd"
version = "0.1.0"
description = "3D acoustic FDTD: room impulse responses with air absorption, validated against analytical results."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Durand-Texte" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
torch = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ac_fdtd"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `tmp/` holds the 2D prototype this repo grew out of: local, unpublished, and not ours to
# reformat.
extend-exclude = ["tmp/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
